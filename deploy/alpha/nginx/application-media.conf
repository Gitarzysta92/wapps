location ~ ^/api/me/application-images(/|$) {
    client_max_body_size 8m;
    client_body_timeout 15s;
    proxy_request_buffering off;
    include /etc/nginx/wapps/auth.conf;
    proxy_pass http://editorial:1337;
}
location ^~ /api/media/applications/ {
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Claims "";
    proxy_set_header X-Auth-Time "";
    proxy_set_header X-Anonymous "";
    proxy_set_header X-Ingress-Auth "";
    proxy_pass http://editorial:1337;
}
location ~* ^/api/me/article-covers/[^/]+/content/?$ {
    client_max_body_size 8m;
    client_body_timeout 15s;
    proxy_request_buffering off;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 65s;
    proxy_send_timeout 20s;
    send_timeout 20s;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_next_upstream off;
    gzip off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/me/article-covers(/|$) {
    client_max_body_size 96k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/((me/articles|editorial/article-reviews)/[^/]+/submissions/[^/]+/cover(/|$)|media/articles(/|$)) {
    client_max_body_size 96k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    send_timeout 20s;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_next_upstream off;
    gzip off;
    proxy_pass http://portal_bff;
}
