location = /_validate {
    internal;
    proxy_pass http://local_auth$validation_path;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_next_upstream off;
    proxy_set_header Authorization $http_authorization;
}
include /etc/nginx/wapps/application-media.conf;
location ~* ^/api/discussions(/|$) {
    client_max_body_size 300k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/(application-discussions|article-comments|application-reviews|me/discussions|discussion-selection)(/|$) {
    client_max_body_size 32k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location = /api/password-recovery {
    limit_req zone=identity_recovery burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://portal_bff;
}
location ~* ^/api/(profiles|me/(profile-follows|totals|badges)|admin/profile-badges)(/|$) {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/(me/suites|editorial/suite-reviews|catalog/(suites|suite-selection))(/|$) {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/(me/application-drafts|editorial/application-reviews)(/|$) {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/(me/ownership-claims|editorial/ownership-reviews)(/|$) {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~ ^/api/me/(releases|articles)(/|$) {
    include /etc/nginx/wapps/auth.conf;
    proxy_pass http://editorial:1337;
}
location ~* ^/api/editorial/health-monitors(/|$) {
    client_max_body_size 8k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~ ^/api/editorial/(release-reviews|article-reviews)(/|$) {
    include /etc/nginx/wapps/auth.conf;
    proxy_pass http://editorial:1337;
}
location ~ ^/api/catalog/(releases(/|$)|articles(/|$)|(article|application)-visibility/|article-selection$) {
    include /etc/nginx/wapps/auth.conf;
    proxy_pass http://editorial:1337;
}
# All account administration, including malformed/unknown actions, crosses BFF.
location ~* ^/api/admin/users(/|$) {
    client_max_body_size 8k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/me/(favorites|notifications)(/|$) {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/me/exports/[^/]+/download/?$ {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 35s;
    proxy_send_timeout 20s;
    send_timeout 35s;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_next_upstream off;
    gzip off;
    proxy_pass http://portal_bff;
}
location ~* ^/api/me/exports(/|$) {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
# Explicit legacy registration migration backlog.
location ~ ^/api/registration(/|$) {
    include /etc/nginx/wapps/auth.conf;
    proxy_pass http://account-management:1340;
}
location ~* ^/api/me/profile/avatar(/|$) {
    client_max_body_size 2m;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
# Unknown account paths must also cross BFF; specialized limits take precedence.
location ~* ^/api/me(/|$) {
    client_max_body_size 64k;
    include /etc/nginx/wapps/auth.conf;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_pass http://portal_bff;
}
location /api/ {
    include /etc/nginx/wapps/auth.conf;
    proxy_pass http://portal_bff;
}
# Authentication validates its own credentials. Expired access tokens must not block refresh.
location /auth/ {
    client_max_body_size 32k;
    limit_req zone=identity_enrollment burst=10 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_pass http://portal_bff/api/auth/;
}
location ^~ /api/auth/ {
    client_max_body_size 32k;
    limit_req zone=identity_enrollment burst=10 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_pass http://portal_bff;
}location = /health { return 200 "healthy\n"; }
