limit_req_zone $binary_remote_addr zone=identity_recovery:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=identity_enrollment:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=identity_login:10m rate=10r/m;

map $http_authorization $validation_path {
    "" /validate-optional;
    default /validate;
}
upstream local_auth { server firebase-auth-validator:8080; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag noindex always;

    location ^~ /api/internal/ { return 404; }
    location = /auth/action { access_log off; try_files /index.html =404; }
    location = /auth/callback { try_files /index.html =404; }
    location = /auth/signin {
        limit_req zone=identity_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://firebase-auth-validator:8080;
    }
    include /etc/nginx/wapps/api.conf;
    location = /release.json { add_header Cache-Control "no-store"; }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
