location ~ ^/api/me/(application-images|article-covers)(/|$) {
    client_max_body_size 8m;
    client_body_timeout 15s;
    proxy_request_buffering off;
    include /etc/nginx/local/auth.conf;
    proxy_pass http://editorial:1337;
}
location ^~ /api/media/applications/ {
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Claims "";
    proxy_set_header X-Auth-Time "";
    proxy_set_header X-Anonymous "";
    proxy_set_header X-Ingress-Auth "";
    proxy_pass http://editorial:1337;
}
location ^~ /api/media/articles/ {
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Claims "";
    proxy_set_header X-Auth-Time "";
    proxy_set_header X-Anonymous "";
    proxy_set_header X-Ingress-Auth "";
    proxy_pass http://editorial:1337;
}
