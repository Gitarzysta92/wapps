# Authenticated requests use strict validation so claims reach the backend.
map $http_authorization $validation_path {
    "" /validate-optional;
    default /validate;
}
upstream local_auth { server firebase-auth-validator:8080; }

server {
    listen 4200;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location / { proxy_pass http://aggregator-demo-csr:80; }
}

server {
    listen 4201;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location / { proxy_pass http://discussion-csr:80; }
}

server {
    listen 4202;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location / { proxy_pass http://catalog-csr:80; }
}

server {
    listen 4203;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location / { proxy_pass http://aggregator-csr:80; }
}

server {
    listen 3000;
    location = /_validate {
        internal;
        proxy_pass http://local_auth$validation_path;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location / {
        include /etc/nginx/local/auth.conf;
        proxy_pass http://catalog-bff:3000;
    }
}

