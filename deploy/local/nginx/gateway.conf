limit_req_zone $binary_remote_addr zone=identity_recovery:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=identity_enrollment:10m rate=10r/m;

# Authenticated requests use strict validation so claims reach the backend.
map $http_authorization $validation_path {
    "" /validate-optional;
    default /validate;
}
upstream local_auth { server firebase-auth-validator:8080; }

server {
    listen 4200;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location = /auth/action { access_log off; proxy_pass http://aggregator-csr:80; }
    location = /auth/callback { proxy_pass http://aggregator-csr:80; }
    location / { proxy_pass http://aggregator-csr:80; }
}

server {
    listen 4201;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location = /auth/callback { proxy_pass http://discussion-csr:80; }
    location / { proxy_pass http://discussion-csr:80; }
}

server {
    listen 4202;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location / { proxy_pass http://catalog-csr:80; }
}

server {
    listen 4203;
    client_max_body_size 20m;
    include /etc/nginx/local/api.conf;
    location = /auth/action { access_log off; proxy_pass http://aggregator-csr:80; }
    location = /auth/callback { proxy_pass http://aggregator-csr:80; }
    location / { proxy_pass http://aggregator-csr:80; }
}

server {
    listen 3000;
    location = /_validate {
        internal;
        proxy_pass http://local_auth$validation_path;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location / {
        include /etc/nginx/local/auth.conf;
        proxy_pass http://catalog-bff:3000;
    }
}

server {
    listen 1337;
    location ^~ /api/internal/ { return 404; }
    include /etc/nginx/local/application-media.conf;
    location = /_validate {
        internal;
        proxy_pass http://local_auth$validation_path;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location / {
        include /etc/nginx/local/auth.conf;
        proxy_pass http://editorial:1337;
    }
}

server {
    listen 1338;
    location ^~ /api/internal/ { return 404; }
    location = /_validate {
        internal;
        proxy_pass http://local_auth$validation_path;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location / {
        include /etc/nginx/local/auth.conf;
        proxy_pass http://discussion:1338;
    }
}

server {
    listen 1340;
    client_max_body_size 2m;
    location = /_validate {
        internal;
        proxy_pass http://local_auth$validation_path;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/password-recovery {
        limit_req zone=identity_recovery burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://account-management:1340;
    }
    location / {
        include /etc/nginx/local/auth.conf;
        proxy_pass http://account-management:1340;
    }
}

server {
    listen 1341;
    location = /_validate {
        internal;
        proxy_pass http://local_auth$validation_path;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location / {
        include /etc/nginx/local/auth.conf;
        proxy_pass http://content-node-registry:3000;
    }
}
