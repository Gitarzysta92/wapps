# Every identity header is replaced with a value from the auth subrequest.
# Client-supplied identity headers must never cross the local gateway unchanged.
auth_request /_validate;
auth_request_set $user_id $upstream_http_x_user_id;
auth_request_set $user_email $upstream_http_x_user_email;
auth_request_set $user_claims $upstream_http_x_user_claims;
auth_request_set $auth_time $upstream_http_x_auth_time;
auth_request_set $anonymous $upstream_http_x_anonymous;
auth_request_set $ingress_auth $upstream_http_x_ingress_auth;
proxy_set_header X-User-Id $user_id;
proxy_set_header X-User-Email $user_email;
proxy_set_header X-User-Claims $user_claims;
proxy_set_header X-Auth-Time $auth_time;
proxy_set_header X-Anonymous $anonymous;
proxy_set_header X-Ingress-Auth $ingress_auth;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
