location = /_validate {
    internal;
    proxy_pass http://local_auth$validation_path;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
}
include /etc/nginx/local/application-media.conf;
location /api/discussions {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://discussion:1338;
}
location /api/article-comments/ {
    client_max_body_size 32k;
    include /etc/nginx/local/auth.conf;
    proxy_pass http://discussion:1338;
}
location = /api/me/discussions {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://discussion:1338;
}
location = /api/discussion-selection {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://discussion:1338;
}
location /api/application-discussions/ {
    client_max_body_size 32k;
    include /etc/nginx/local/auth.conf;
    proxy_pass http://discussion:1338;
}
location /api/application-reviews/ {
    client_max_body_size 32k;
    include /etc/nginx/local/auth.conf;
    proxy_pass http://discussion:1338;
}
location = /api/password-recovery {
    limit_req zone=identity_recovery burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://account-management:1340;
}
location /api/profiles {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://account-management:1340;
}
location ~ ^/api/me/(suites|application-drafts|ownership-claims|releases|articles)(/|$) {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://editorial:1337;
}
location ~ ^/api/editorial/(suite-reviews|application-reviews|ownership-reviews|release-reviews|article-reviews|health-monitors)(/|$) {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://editorial:1337;
}
location ~ ^/api/catalog/(suites(/|$)|releases(/|$)|articles(/|$)|(article|application)-visibility/|suite-selection$|article-selection$) {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://editorial:1337;
}
location ~ ^/api/(me|registration|admin/(users|profile-badges))(/|$) {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://account-management:1340;
}
location /api/ {
    include /etc/nginx/local/auth.conf;
    proxy_pass http://catalog-bff:3000;
}
location = /auth/register {
    limit_req zone=identity_enrollment burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://firebase-auth-validator:8080;
}
location ~ ^/auth/password-reset/(verify|complete)$ {
    limit_req zone=identity_enrollment burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://firebase-auth-validator:8080;
}
location ~ ^/auth/email-verification/(status|request|verify|complete)$ {
    limit_req zone=identity_enrollment burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://firebase-auth-validator:8080;
}
location /auth/ { proxy_pass http://firebase-auth-validator:8080; }
location = /health { return 200 "healthy\n"; }
