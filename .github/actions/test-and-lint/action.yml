name: 'Test and Lint'
description: 'Run tests and linting for the application'
inputs:
  app-name:
    description: 'Nx application name'
    required: true
  working-directory:
    description: 'Working directory for the command'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check project and architecture
      env:
        APP_NAME: ${{ inputs.app-name }}
        NX_DAEMON: 'false'
        NX_ISOLATE_PLUGINS: 'false'
        NX_NO_CLOUD: 'true'
      run: |
        npx nx show project "$APP_NAME" --json
        npm run check:boundaries
        npm run check:inventory
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Run workspace linting
      run: npm run lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Run inventoried tests
      run: npm test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
