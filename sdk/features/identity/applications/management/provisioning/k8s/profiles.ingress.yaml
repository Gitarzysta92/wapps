apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-profiles-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/auth-url: "http://authenticator.default.svc.cluster.local/validate-optional"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-Id,X-User-Email,X-User-Claims,X-Auth-Time,X-Anonymous,X-Ingress-Auth"
spec:
  ingressClassName: nginx
  rules:
    - host: account-management.host.placeholder
      http:
        paths:
          - path: /api/profiles
            pathType: Prefix
            backend:
              service:
                name: account-management
                port:
                  number: 80
