<div class="card-top-edge">
  <ng-content select="[slot='top-edge']"></ng-content>
</div>

<div class="card-header">
  <ng-content select="[slot='header']"></ng-content>
</div>

<div class="card-body">
  <ng-content></ng-content>
</div>

<div class="card-footer">
  <ng-content select="[slot='footer']"></ng-content>
</div>

<div class="card-toolbar" [class.card-toolbar--with-actions]="!!actions">
  <div class="card-bottom-bar">
    <ng-content select="[slot='bottom-bar']"></ng-content>
    <div class="card-bottom-bar-end">
      <ng-content select="[slot='bottom-bar-end']"></ng-content>
      @if (footerActions && !actionsOpen) {
      <div class="card-footer-actions">
        <ng-container [ngTemplateOutlet]="footerActions" [ngTemplateOutletContext]="{ iconOnly: true }" />
      </div>
      }
    </div>
  </div>
  @if (actions || footerActions) {
  <div class="card-actions">
    <button
      #actionsToggle
      class="card-actions-toggle"
      tuiButton
      type="button"
      size="s"
      appearance="flat"
      iconStart="@tui.ellipsis"
      aria-label="Item actions"
      [attr.aria-expanded]="actionsOpen"
      [tuiDropdown]="actionsMenu"
      tuiDropdownAlign="right"
      [(tuiDropdownOpen)]="actionsOpen"
    ></button>
    @if (actions && !actionsOpen) {
    <div class="card-actions-content card-actions-inline">
      <ng-container [ngTemplateOutlet]="actions" [ngTemplateOutletContext]="{ iconOnly: true }" />
    </div>
    }
  </div>
  }
</div>

<ng-template #actionsMenu>
  <div
    class="card-actions-content card-actions-content--menu"
    tuiAppearance="action-menu"
    role="group"
    aria-label="Item actions"
  >
    <ng-container [ngTemplateOutlet]="actions ?? null" [ngTemplateOutletContext]="{ iconOnly: false }" />
    <ng-container [ngTemplateOutlet]="footerActions ?? null" [ngTemplateOutletContext]="{ iconOnly: false, activeZone: actionsZone }" />
  </div>
</ng-template>
