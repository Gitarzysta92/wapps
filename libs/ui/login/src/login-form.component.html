<form [formGroup]="loginForm" (ngSubmit)="submitForm()">
  <div class="form-field">
    <tui-textfield iconStart="@tui.mail">
      <label tuiLabel>Email</label>
      <input tuiTextfield type="email" autocomplete="username" formControlName="login" />
    </tui-textfield>
    <input-validation class="error-container" aria-live="polite"
      [control]="loginForm.controls.login" [messages]="validationMessages.email" />
  </div>

  <div class="form-field">
    <tui-textfield iconStart="@tui.lock">
      <label tuiLabel>Password</label>
      <input #password tuiTextfield type="password" autocomplete="current-password" formControlName="password" />
      <tui-icon tuiPassword role="button" tabindex="0"
        [attr.aria-label]="password.type === 'password' ? 'Show password' : 'Hide password'"
        (keydown.enter)="activatePasswordToggle($event)" (keydown.space)="activatePasswordToggle($event)" />
    </tui-textfield>
    <input-validation class="error-container" aria-live="polite"
      [control]="loginForm.controls.password" [messages]="validationMessages.password" />
    <div class="password-recovery"><ng-content select="[slot='password-recovery']" /></div>
  </div>
  <ng-content select="button[type=submit]" />
</form>
