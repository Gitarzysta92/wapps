# Coolify builds this from the repository root. Cloudflared runs on the host.
services:
  portal:
    build:
      context: .
      dockerfile: deploy/alpha/Dockerfile
    ports:
      - "127.0.0.1:4203:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
