apiVersion: apps/v1
kind: Deployment
metadata:
  name: editorial
  namespace: editorial
  labels:
    app: editorial
    app.kubernetes.io/name: editorial
    app.kubernetes.io/component: cms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: editorial
  template:
    metadata:
      labels:
        app: editorial
    spec:
      serviceAccountName: editorial-service
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: editorial
          image: ghcr.io/gitarzysta92/wapps/editorial:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 1337
              protocol: TCP
          env:
            - name: EXPLORE_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: explore-service-secret
                  key: secret
                  optional: true
            - name: NOTIFICATION_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: secret
            - name: ACCOUNT_ERASURE_SECRET
              valueFrom:
                secretKeyRef:
                  name: account-erasure-secret
                  key: secret
            - name: ACCOUNT_EXPORT_SOURCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: account-export-secret
                  key: secret
            - name: INGRESS_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: INGRESS_AUTH_SECRET
            - name: OPA_URL
              value: "http://opa.opa:8181"
            - name: EDITORIAL_PUBLIC_TENANT
              value: "default"
            - name: EDITORIAL_SEED_DEMO_DATA
              value: "false"
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: MONGO_PORT
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: MONGO_PASSWORD
            - name: MONGO_DATABASE
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: MONGO_DATABASE
            - name: QUEUE_HOST
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: QUEUE_HOST
            - name: QUEUE_PORT
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: QUEUE_PORT
            - name: QUEUE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: QUEUE_USERNAME
            - name: QUEUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: QUEUE_PASSWORD
            - name: EDITORIAL_NODE_ENV
              value: "production"
            - name: EDITORIAL_HOST
              value: "0.0.0.0"
            - name: EDITORIAL_PORT
              value: "1337"
            - name: EDITORIAL_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: EDITORIAL_DATABASE_HOST
            - name: EDITORIAL_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: EDITORIAL_DATABASE_PORT
            - name: EDITORIAL_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: EDITORIAL_DATABASE_USERNAME
            - name: EDITORIAL_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: EDITORIAL_DATABASE_PASSWORD
            - name: EDITORIAL_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: editorial-app-secrets
                  key: EDITORIAL_DATABASE_NAME
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /api/health
              port: 1337
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 1337
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 1337
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
