<button
  tuiButton
  [attr.tuiIconButton]="iconOnly ? '' : null"
  [attr.title]="iconOnly ? 'Share ' + title : null"
  type="button"
  [size]="size"
  [appearance]="appearance"
  [attr.aria-label]="'Share ' + title"
  [attr.aria-expanded]="open"
  [tuiDropdown]="options"
  [tuiActiveZoneParent]="activeZone"
  tuiDropdownAlign="right"
  [tuiDropdownOpen]="open"
  (tuiDropdownOpenChange)="setOpen($event)"
>
  <tui-icon icon="@tui.share" aria-hidden="true" />
  @if (!iconOnly) { Share }
</button>

<ng-template #options>
  <section class="share-options" tuiAppearance="action-menu" role="group" aria-label="Share options" [attr.aria-busy]="isSharing()">
    @if (linkUrl()) {
      <button tuiButton type="button" size="s" appearance="flat" iconStart="@tui.copy" [disabled]="isSharing()" (click)="copy()">Copy link</button>
      @if (deviceShareAvailable()) {
        <button tuiButton type="button" size="s" appearance="flat" iconStart="@tui.share" [disabled]="isSharing()" (click)="share()">Share via device</button>
      }
    }
    @if (message()) { <p class="feedback" role="status">{{ message() }}</p> }
    @if (fallbackUrl()) {
      <label class="fallback">Link to {{ title }}
        <input #link readonly [value]="fallbackUrl()" (focus)="link.select()" (click)="link.select()" />
      </label>
    }
  </section>
</ng-template>
