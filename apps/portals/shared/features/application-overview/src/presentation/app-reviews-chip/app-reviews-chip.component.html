@if (reviewsLink() && !readonly()) {
  <a
    [routerLink]="reviewsLink()"
    tuiButton
    [size]="size()"
    [appearance]="appearance()"
    class="app-reviews-chip" [attr.aria-label]="'Read ' + reviewsCount() + ' reviews'">
    <tui-icon icon="@tui.message-circle" />
    <span class="reviews-label">See Reviews</span>
    <span class="reviews-count">{{ reviewsCount() }}<span class="reviews-label"> reviews</span></span>
  </a>
} @else {
  <button
    tuiButton
    [size]="size()"
    [appearance]="appearance()"
    [disabled]="readonly()"
    class="app-reviews-chip" [attr.aria-label]="'Read ' + reviewsCount() + ' reviews'">
    <tui-icon icon="@tui.message-circle" />
    <span class="reviews-label">See Reviews</span>
    <span class="reviews-count">{{ reviewsCount() }}<span class="reviews-label"> reviews</span></span>
  </button>
}
