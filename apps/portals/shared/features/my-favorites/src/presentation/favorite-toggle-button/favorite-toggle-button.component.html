@let isFav = isFavorite$ | async;
<button 
  tuiButton
  [attr.tuiIconButton]="iconOnly ? '' : null"
  [attr.title]="iconOnly ? (isFav ? 'Remove from Favorites' : 'Add to Favorites') : null"
  type="button"
  appearance="secondary"
  size="s"
  iconStart="@tui.star"
  [class.is-favorite]="isFav"
  [attr.aria-label]="isFav ? 'Remove from Favorites' : 'Add to Favorites'"
  [attr.aria-pressed]="isFav"
  (click)="toggleFavorite(isFav ?? false)">
  @if (!iconOnly) { <span class="favorite-label">{{ isFav ? 'Remove from Favorites' : 'Add to Favorites' }}</span> }
</button>


@if (error()) { <p role="alert">{{ error() }}</p> }
