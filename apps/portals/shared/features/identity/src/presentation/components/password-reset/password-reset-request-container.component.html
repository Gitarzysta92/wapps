@if (!sent) {
<password-reset-request-form (onSubmit)="onFormSubmit($event)">
  <button tuiButton type="submit" [disabled]="isProcessing">
    <tui-loader
      class="loader"
      [inheritColor]="true"
      [overlay]="true"
      [showLoader]="isProcessing"
    />
    Request reset
  </button>
</password-reset-request-form>
} @if (message) {
<tui-notification [attr.role]="sent ? 'status' : 'alert'">{{
  message
}}</tui-notification>
}
