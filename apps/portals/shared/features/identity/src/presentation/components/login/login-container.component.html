@if (showEmailPasswordForm) {
<login-form #loginForm (onSubmit)="authenticate($event)">
  <ng-content
    select="[slot='password-recovery']"
    ngProjectAs="[slot='password-recovery']"
  />
  <button
    tuiButton
    type="submit"
    size="m"
    appearance="primary"
    [disabled]="!loginForm.valid || isAuthenticating"
  >
    <tui-loader
      class="loader"
      [inheritColor]="true"
      [overlay]="true"
      [showLoader]="
        isAuthenticating &&
        authenticatingProvider === AuthenticationProvider.EMAIL_PASSWORD
      "
    />
    Sign in
  </button>
</login-form>
} @if (availableMethods$ | async; as methods) { @if (showEmailPasswordForm &&
hasAlternativeMethods(methods)) {
<div class="divider">
  <span>or continue with</span>
</div>
}

<provider-buttons
  [methods]="methods"
  [authenticatingProvider]="authenticatingProvider"
  (onProviderClick)="authenticateWithProvider($event)"
>
</provider-buttons>
} @if (loadingMethods) {
<p role="status">Loading sign-in options...</p>
} @if (methodsError) {
<tui-notification role="alert">{{ methodsError }}</tui-notification>
<button tuiButton type="button" (click)="loadMethods()">Retry</button>
} @if (error) {
<tui-notification size="l" class="error-notification" role="alert">{{
  error
}}</tui-notification>
}
