@if (registered) {
<tui-notification role="status"
  >Your account is ready. Sign in to continue. Open Profile Settings to verify your sign-in email.</tui-notification
>
} @else {
<registration-form #registrationForm (onSubmit)="register($event)">
  <button
    tuiButton
    type="submit"
    [disabled]="!registrationForm.valid || isRegistering"
  >
    <tui-loader
      class="loader"
      [inheritColor]="true"
      [overlay]="true"
      [showLoader]="isRegistering"
    />
    Create account
  </button>
</registration-form>
} @if (error) {
<tui-notification role="alert">{{ error }}</tui-notification>
}
