<button
  tuiButton
  type="button"
  size="xs"
  appearance="flat"
  class="attribution-badge-trigger"
  iconStart="@tui.info"
  [attr.aria-label]="'Content attribution for ' + title + ': ' + (attribution.displayText || 'Source details')"
  [attr.aria-expanded]="open"
  [tuiDropdown]="content"
  tuiDropdownAlign="right"
  [(tuiDropdownOpen)]="open"
>
  <span class="attribution-label">Content info</span>
</button>

<ng-template #content>
  <section class="attribution-popover" aria-label="Content attribution">
    <strong>{{ attribution.displayText || 'Source details' }}</strong>
    <p>{{ attribution.tooltipText }}</p>
  </section>
</ng-template>
