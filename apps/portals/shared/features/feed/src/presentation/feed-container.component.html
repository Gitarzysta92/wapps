@if (state$ | async; as state) {
<content-feed
  class="content-feed"
  [feedItems]="state.items"
  [itemTemplate]="itemTemplate"
  (scrolledToBottom)="!state.error && loadNextItems()">
</content-feed>
@if (state.loading) {
  <p role="status">Loading activity…</p>
} @else if (state.error) {
  <ui-content-state title="Could not load activity" description="Please try again. Any activity already loaded is still available above." icon="@tui.circle-alert" [error]="true">
    <button tuiButton size="m" type="button" (click)="loadNextItems()">Retry</button>
    <a tuiButton size="m" appearance="secondary" routerLink="/discover">Discover content</a>
  </ui-content-state>
} @else if (state.loaded && !state.items.length) {
  <ui-content-state title="No activity yet" description="Updates will appear here when they are available. Discover more content in the meantime." icon="@tui.clock">
    <a tuiButton size="m" appearance="secondary" routerLink="/discover">Discover content</a>
  </ui-content-state>
}
}
