<div class="top-review-card" tuiAppearance="review-preview" [class.has-details]="detailsLink()">
  <div class="review-header">
    <tui-avatar
      [src]="review().authorAvatarUrl"
      size="xs"
      class="author-avatar">
    </tui-avatar>
    <div class="author-info">
      <span class="author-name">{{ review().authorName }}</span>
      <ng-content select="[slot='badges']"></ng-content>
    </div>
    <span class="review-rating">★ {{ review().rating.toFixed(1) }}</span>
  </div>
  <div class="review-content">
    {{ review().content }}
  </div>
  <div class="review-date">
    {{ review().date }}
  </div>
  @if (detailsLink()) {
    <a class="review-details" tuiLink [routerLink]="detailsLink()">View details</a>
  }
</div>
