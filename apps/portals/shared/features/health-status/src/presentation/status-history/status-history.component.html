<div class="status-history" *ngIf="statusesHistory() && statusesHistory().length > 0">
  <small class="status-label">Last {{ statusesHistory().length }} days:</small>
  <div class="status-days" role="list" aria-label="Daily service status">
    <div
      *ngFor="let statusItem of statusesHistory()"
      class="status-dot"
      role="listitem"
      tabindex="0"
      [attr.data-status]="getStatusClass(statusItem.status)"
      [class.operational]="getStatusClass(statusItem.status) === 'operational'"
      [class.degraded]="getStatusClass(statusItem.status) === 'degraded'"
      [class.outage]="getStatusClass(statusItem.status) === 'outage'"
      [class.unknown]="getStatusClass(statusItem.status) === 'unknown'"
      [attr.aria-label]="statusItem.label || (getStatusLabel(statusItem.status) + ' on ' + (statusItem.timestamp | date:'yyyy-MM-dd':'UTC') + ' UTC')"
      [title]="statusItem.label || (getStatusLabel(statusItem.status) + ' on ' + (statusItem.timestamp | date:'yyyy-MM-dd':'UTC') + ' UTC')">
    </div>
  </div>
</div>
