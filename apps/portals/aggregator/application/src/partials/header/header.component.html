<form class="global-search" role="search" aria-label="Global catalog search" (submit)="submitSearch($event)">
  <tui-textfield iconStart="@tui.search" tuiTextfieldSize="m">
    <input tuiTextfield type="search" [formControl]="search"
      aria-label="Search applications, articles and suites"
      placeholder="Search applications, articles and suites" />
  </tui-textfield>
  <button tuiButton type="submit" size="m" appearance="primary">Search</button>
</form>
