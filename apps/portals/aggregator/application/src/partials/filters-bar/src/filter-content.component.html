@if (singleSelection) {
  <div class="single-options" role="radiogroup" [attr.aria-label]="filterName">
    @for (item of items; track item.value) {
      <label>
        <input tuiRadio type="radio" [name]="filterId" [value]="item.value"
          [ngModel]="selectedOptions[0]?.value ?? ''"
          (ngModelChange)="onSelectionChange([item])" />
        {{ item.name }}
      </label>
    }
  </div>
} @else if (filterId === 'search') {
  <text-search-input [selectedOptions]="selectedOptions" [placeholder]="placeholder"
    (textChange)="onSelectionChange($event)" />
} @else {
  <multiselect-list [items]="items" [selectedOptions]="selectedOptions"
    [placeholder]="placeholder" [groupLabel]="filterName" [showSelectionSummary]="showSelectionSummary"
    (selectionChange)="onSelectionChange($event)" />
}
