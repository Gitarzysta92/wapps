<div class="portal-logo-wrapper">
  <a [routerLink]="avatarLink()" [attr.aria-label]="navigationAvatar()?.label || 'Home'">
    @if (avatarPath(); as path) {
      <tui-avatar [src]="path" size="xl"/>
    } @else {
      <tui-avatar [src]="'@tui.mastercard' | tuiIcon" size="xl"/>
    } 
  </a>
</div>


<nav navigationList [alignment]="alignment()">
  @for (item of navigation(); track item.path) {
    <a #navigationItem #activeLink="routerLinkActive"
      navigationItem
      appearance="navigation-primary"
      [routerLink]="item.path.startsWith('/') ? item.path : '/' + item.path"
      routerLinkActive=""
      [class.active]="activeLink.isActive && primaryActiveClass(item.path) === 'active'"
      [attr.aria-current]="activeLink.isActive && primaryActiveClass(item.path) === 'active' ? 'page' : null"
      [routerLinkActiveOptions]="navigationItem.getActiveOptions(item.path)">
      <span slot="center" class="nav-label">{{ item.label }}</span>
      @if (item.icon) {
        <tui-icon slot="end" [icon]="item.icon"/>
      }
    </a>
  }
</nav>

@if (navigationSecondary()) {
  <ui-divider /> 

  <nav navigationList [alignment]="alignment()">
    @for (item of navigationSecondary(); track item.path) {
      <a #navigationItem
        navigationItem
        appearance="navigation-primary"
        [routerLink]="item.path.startsWith('/') ? item.path : '/' + item.path"
        [routerLinkActive]="navigationItem.activeClass"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="navigationItem.getActiveOptions(item.path)">
        <span slot="center" class="nav-label">{{ item.label }}</span>
        @if (item.icon) {
          <tui-icon slot="end" [icon]="item.icon"/>
        }
      </a>
    }
  </nav>
}
