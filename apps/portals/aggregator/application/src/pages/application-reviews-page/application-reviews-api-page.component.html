<ui-page-header class="page-header">
  <ui-breadcrumbs slot="top-bar" [breadcrumbs]="breadcrumbs()" />
  <h1 uiPageTitle slot="title">
    <tui-icon icon="@tui.star" /> {{ reviewSlug() ? 'Member review' : 'Reviews & Testimonials' }}
  </h1>
  <p slot="meta">
    Member experiences{{ application() ? ' with ' + application()!.name : '' }}.
  </p>
  <a
    tuiButton
    slot="actions"
    size="s"
    appearance="secondary"
    [routerLink]="overviewLink()"
    >Application</a
  >
  <nav slot="navigation" aria-label="Review sections">
    <a
      tuiLink
      [routerLink]="listLink()"
      [attr.aria-current]="reviewSlug() ? null : 'page'"
      >All reviews</a
    >
  </nav>
</ui-page-header>
<section class="review-page" [attr.aria-busy]="app.isLoading()">
  @if (application()) {
  <member-reviews [detail]="!!reviewSlug()" [reviewLink]="reviewLink" /> } @else
  {
  <application-content-state [reader]="app" />
  }
</section>
